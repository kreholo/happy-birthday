<!DOCTYPE html>
<html lang="tr">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7220337370405776"
         crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sürpriz Oluşturucu ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #180e2e 0%, #29144a 50%, #3e1e69 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 24px 14px 40px;
            color: #333;
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            padding: 26px 18px;
            border-radius: 22px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 440px;
            text-align: center;
            margin-bottom: 20px;
        }

        h2 { 
            color: #2b1055; 
            font-size: 1.55rem;
            margin-bottom: 4px; 
            font-weight: 700;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            padding: 0 2px;
        }

        label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #374151;
        }

        .char-counter {
            font-size: 0.72rem;
            color: #94a3b8;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.92rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            background: #f8fafc;
        }

        input:focus, textarea:focus {
            border-color: #764ba2;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.15);
        }

        textarea {
            resize: none;
            height: 90px;
            line-height: 1.45;
        }

        /* Tema Seçim Tablosu */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 4px;
        }

        .theme-option {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: #ffffff;
            user-select: none;
        }

        .theme-option:hover {
            transform: translateY(-2px);
        }

        .theme-option.active {
            border-color: #764ba2;
            background: #fbf9ff;
            box-shadow: 0 4px 10px rgba(118, 75, 162, 0.22);
        }

        .theme-circle {
            width: 100%;
            height: 26px;
            border-radius: 7px;
        }

        .theme-name {
            font-size: 0.72rem;
            font-weight: 600;
            color: #475569;
        }

        .theme-option.active .theme-name {
            color: #764ba2;
        }

        .btn-submit {
            background: linear-gradient(135deg, #764ba2, #ff0055);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.95rem;
            width: 100%;
            font-weight: 700;
            transition: transform 0.2s, filter 0.2s;
            margin-top: 8px;
            box-shadow: 0 6px 16px rgba(118, 75, 162, 0.35);
        }

        .btn-submit:hover { 
            transform: scale(1.02); 
            filter: brightness(1.05);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        #result-area {
            display: none;
            margin-top: 18px;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 16px;
            border-radius: 14px;
            animation: fadeIn 0.3s ease;
        }

        #result-area p {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        #generated-link {
            word-break: break-all;
            color: #764ba2;
            font-size: 0.82rem;
            margin-bottom: 12px;
            display: block;
            text-decoration: none;
            background: #ffffff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            user-select: all;
        }

        .copy-btn {
            width: 100%;
            background: #10b981;
            color: white;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .copy-btn:hover { 
            background: #059669; 
        }

        .ad-container {
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            border-radius: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎉 Sürpriz Hazırla</h2>
        <p class="subtitle">Arkadaşın için özel kutlama bağlantısı oluştur.</p>

        <div class="form-group">
            <div class="label-row">
                <label for="nameInput">Kimin Doğum Günü?</label>
                <span class="char-counter" id="nameCounter">0/25</span>
            </div>
            <input type="text" id="nameInput" maxlength="25" placeholder="Örn: Alanur" oninput="guncelleSayac('nameInput', 'nameCounter', 25)">
        </div>
        
        <div class="form-group">
            <div class="label-row">
                <label for="dateInput">Doğum Tarihi:</label>
            </div>
            <input type="date" id="dateInput">
        </div>

        <div class="form-group">
            <div class="label-row">
                <label for="noteInput">Kutlama Mesajın:</label>
                <span class="char-counter" id="noteCounter">0/160</span>
            </div>
            <textarea id="noteInput" maxlength="160" placeholder="Örn: Yeni yaşın sana tüm güzellikleri getirsin!" oninput="guncelleSayac('noteInput', 'noteCounter', 160)"></textarea>
        </div>

        <div class="form-group">
            <div class="label-row">
                <label>🎨 Tema Seçimi:</label>
            </div>
            <div class="theme-grid" id="themeContainer"></div>
        </div>

        <button class="btn-submit" onclick="createLink()">Linki Oluştur 🪄</button>

        <div id="result-area">
            <p>👇 Sürpriz linkin hazır!</p>
            <div id="generated-link">...</div>
            <button class="copy-btn" onclick="copyLink()" id="copyButton">Linki Kopyala 📋</button>
        </div>
    </div>

    <!-- AdSense Reklam Alanı -->
    <div class="ad-container">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-7220337370405776"
             data-ad-slot="1613768173"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <script>
        const temalar = [
            { id: "gece", name: "Kozmik", bg: "radial-gradient(circle, #2b1055, #100524)" },
            { id: "gunbatimi", name: "Günbatımı", bg: "linear-gradient(135deg, #8e0e00, #1f1c2c)" },
            { id: "neon", name: "Siber Neon", bg: "linear-gradient(135deg, #090979, #790974)" },
            { id: "zumrut", name: "Zümrüt", bg: "linear-gradient(135deg, #052e16, #047857)" },
            { id: "seker", name: "Şeker", bg: "linear-gradient(135deg, #fd1d1d, #fcb045)" },
            { id: "aurora", name: "Kutup", bg: "linear-gradient(135deg, #0b132b, #5bc0be)" }
        ];

        let seciliTema = "gece";

        window.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("themeContainer");
            temalar.forEach((t) => {
                const opt = document.createElement("div");
                opt.className = `theme-option ${t.id === seciliTema ? 'active' : ''}`;
                opt.onclick = () => temaBelirle(t.id);
                opt.innerHTML = `
                    <div class="theme-circle" style="background: ${t.bg};"></div>
                    <span class="theme-name">${t.name}</span>
                `;
                container.appendChild(opt);
            });
        });

        function temaBelirle(temaId) {
            seciliTema = temaId;
            document.querySelectorAll(".theme-option").forEach((el, index) => {
                el.classList.toggle("active", temalar[index].id === temaId);
            });
        }

        function guncelleSayac(inputId, counterId, max) {
            const val = document.getElementById(inputId).value;
            document.getElementById(counterId).innerText = `${val.length}/${max}`;
        }

        function createLink() {
            const name = document.getElementById('nameInput').value.trim();
            const note = document.getElementById('noteInput').value.trim();
            const date = document.getElementById('dateInput').value;

            if (!name || !note || !date) {
                alert("Lütfen isim, doğum tarihi ve mesaj alanlarını eksiksiz doldurun!");
                return;
            }

            const params = new URLSearchParams();
            params.set('ad', name);
            params.set('not', note);
            params.set('tarih', date);
            params.set('tema', seciliTema);

            const currentUrl = window.location.href.split('?')[0];
            const lastSlashIndex = currentUrl.lastIndexOf('/');
            const folderUrl = currentUrl.substring(0, lastSlashIndex + 1);

            const finalLink = `${folderUrl}kutla.html?${params.toString()}`;

            const linkElem = document.getElementById('generated-link');
            linkElem.innerText = finalLink;

            document.getElementById('result-area').style.display = 'block';
        }

        function copyLink() {
            const linkText = document.getElementById('generated-link').innerText;
            const copyBtn = document.getElementById('copyButton');
            
            navigator.clipboard.writeText(linkText).then(() => {
                copyBtn.innerText = "Kopyalandı! ✓";
                setTimeout(() => copyBtn.innerText = "Linki Kopyala 📋", 2000);
            }).catch(() => {
                // Clipboard API engellendiyse klasik yöntem
                const tempInput = document.createElement("input");
                tempInput.value = linkText;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                copyBtn.innerText = "Kopyalandı! ✓";
                setTimeout(() => copyBtn.innerText = "Linki Kopyala 📋", 2000);
            });
        }
    </script>
</body>
</html>
