<!-- =================================================================
     DOSYA 1: index.html (Sürpriz Hazırlama & Tema Ayar Sayfası)
     ================================================================= -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sürpriz Kartı Hazırla 🎁</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #ff0055;
            --primary-glow: rgba(255, 0, 85, 0.4);
            --bg-base: #0f0c20;
            --card-bg: rgba(255, 255, 255, 0.07);
            --border-glass: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            background-color: var(--bg-base);
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px;
        }

        .ambient-glow {
            position: fixed;
            top: -10vw;
            left: -10vw;
            width: 50vw;
            height: 50vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(117, 151, 222, 0.25) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .ambient-glow-2 {
            position: fixed;
            bottom: -15vw;
            right: -10vw;
            width: 60vw;
            height: 60vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 0, 85, 0.2) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 560px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        header {
            text-align: center;
        }

        header h1 {
            font-family: 'Pacifico', cursive;
            font-size: clamp(2rem, 5vw, 2.5rem);
            color: #ffffff;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 0.95rem;
            color: var(--text-sub);
            font-weight: 300;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        label {
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input[type="text"],
        input[type="date"],
        textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 14px 16px;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        textarea:focus {
            border-color: #ff0055;
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: rgba(0, 0, 0, 0.5);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
            line-height: 1.5;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        /* Tema Seçim Paneli */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 4px;
        }

        @media (min-width: 480px) {
            .theme-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .theme-card {
            border: 2px solid transparent;
            border-radius: 14px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            user-select: none;
        }

        .theme-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.1);
        }

        .theme-card.active {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
        }

        .theme-card.active::after {
            content: "✓";
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #ffffff;
            background: rgba(0,0,0,0.5);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-preview {
            width: 100%;
            height: 38px;
            border-radius: 9px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        .theme-name {
            font-size: 0.78rem;
            font-weight: 600;
            color: #e2e8f0;
            text-align: center;
            white-space: nowrap;
        }

        /* Butonlar */
        .btn-generate {
            width: 100%;
            background: linear-gradient(135deg, #ff0055, #ff557f);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 10px 25px -5px var(--primary-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -4px var(--primary-glow);
        }

        .btn-generate:active {
            transform: scale(0.98);
        }

        /* Çıktı Kutusu */
        .result-box {
            display: none;
            flex-direction: column;
            gap: 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(255, 255, 255, 0.25);
            border-radius: 18px;
            padding: 18px;
            animation: fadeIn 0.4s ease forwards;
        }

        .link-display {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.82rem;
            color: #94a3b8;
            word-break: break-all;
            max-height: 75px;
            overflow-y: auto;
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            color: white;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.15);
        }
        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .btn-preview {
            background: #0ea5e9;
        }
        .btn-preview:hover {
            background: #0284c7;
        }

        .btn-whatsapp {
            grid-column: span 2;
            background: #25d366;
            color: #0b2914;
            font-weight: 700;
        }
        .btn-whatsapp:hover {
            background: #20ba59;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>

    <main class="container">
        <header>
            <h1>Sürpriz Yap ✨</h1>
            <p>Sevdiklerine özel temalı kutlama sayfası tasarla</p>
        </header>

        <div class="form-group">
            <label for="inputAd">🎉 Kutlanacak Kişinin Adı</label>
            <input type="text" id="inputAd" placeholder="Örn: Ayşe veya Can Dostum" autocomplete="off" />
        </div>

        <div class="form-group">
            <label for="inputTarih">📅 Doğum Tarihi (Gün/Ay/Yıl)</label>
            <input type="date" id="inputTarih" />
        </div>

        <div class="form-group">
            <label for="inputNot">💌 Özel Doğum Günü Notu</label>
            <textarea id="inputNot" placeholder="Ona kalbinden geçen içten bir mesaj bırak..."></textarea>
        </div>

        <div class="form-group">
            <label>🎨 Renk & Atmosfer Teması</label>
            <div class="theme-grid" id="themeGrid">
                <!-- Temalar Dinamik JS ile doldurulacak -->
            </div>
        </div>

        <button type="button" class="btn-generate" onclick="linkiOlustur()">
            <span>✨ Sürpriz Linkini Oluştur</span>
        </button>

        <section class="result-box" id="resultBox">
            <div class="link-display" id="linkDisplay"></div>
            <div class="action-row">
                <button type="button" class="btn-action btn-copy" onclick="panoyaKopyala()" id="copyBtn">📋 Kopyala</button>
                <a href="#" target="_blank" class="btn-action btn-preview" id="previewLink">👁️ Önizle</a>
                <button type="button" class="btn-action btn-whatsapp" onclick="whatsapptaPaylas()">💬 WhatsApp ile Gönder</button>
            </div>
        </section>
    </main>

    <script>
        const themes = [
            { id: "gece", name: "Kozmik Gece", bg: "radial-gradient(circle at center, #2b1055, #100524, #05010e)" },
            { id: "gunbatimi", name: "Gün Batımı", bg: "linear-gradient(135deg, #4a0033, #8e0e00, #1f1c2c)" },
            { id: "neon", name: "Siber Neon", bg: "linear-gradient(135deg, #090979, #00d4ff, #790974)" },
            { id: "zumrut", name: "Zümrüt Büyüsü", bg: "linear-gradient(135deg, #052e16, #065f46, #047857)" },
            { id: "seker", name: "Şeker Pembe", bg: "linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045)" },
            { id: "aurora", name: "Kutup Işığı", bg: "linear-gradient(135deg, #0b132b, #1c2541, #5bc0be)" }
        ];

        let secilenTema = "gece";
        let olusturulanUrl = "";

        window.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById("themeGrid");
            themes.forEach((t, i) => {
                const card = document.createElement("div");
                card.className = `theme-card ${t.id === secilenTema ? 'active' : ''}`;
                card.onclick = () => temaSec(t.id);
                card.innerHTML = `
                    <div class="theme-preview" style="background: ${t.bg};"></div>
                    <span class="theme-name">${t.name}</span>
                `;
                grid.appendChild(card);
            });
        });

        function temaSec(temaId) {
            secilenTema = temaId;
            document.querySelectorAll(".theme-card").forEach((card, index) => {
                card.classList.toggle("active", themes[index].id === temaId);
            });
        }

        function linkiOlustur() {
            const ad = document.getElementById("inputAd").value.trim() || "Arkadaşım";
            const not = document.getElementById("inputNot").value.trim() || "Yeni yaşında yüzünden tebessüm, kalbinden huzur hiç eksik olmasın. Mutlu yıllar!";
            const tarih = document.getElementById("inputTarih").value;

            const url = new URL("kutlama.html", window.location.href);
            url.searchParams.set("ad", ad);
            url.searchParams.set("not", not);
            url.searchParams.set("tema", secilenTema);
            if (tarih) {
                url.searchParams.set("tarih", tarih);
            }

            olusturulanUrl = url.toString();

            document.getElementById("linkDisplay").innerText = olusturulanUrl;
            document.getElementById("previewLink").href = olusturulanUrl;
            document.getElementById("resultBox").style.display = "flex";
            document.getElementById("resultBox").scrollIntoView({ behavior: 'smooth' });
        }

        async function panoyaKopyala() {
            const copyBtn = document.getElementById("copyBtn");
            try {
                await navigator.clipboard.writeText(olusturulanUrl);
                copyBtn.innerText = "✓ Kopyalandı!";
                setTimeout(() => copyBtn.innerText = "📋 Kopyala", 2000);
            } catch (err) {
                const tempInput = document.createElement("input");
                tempInput.value = olusturulanUrl;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                copyBtn.innerText = "✓ Kopyalandı!";
                setTimeout(() => copyBtn.innerText = "📋 Kopyala", 2000);
            }
        }

        function whatsapptaPaylas() {
            const ad = document.getElementById("inputAd").value.trim() || "Arkadaşım";
            const metin = `🎂 Sana özel bir doğum günü sürprizi hazırladım! Hemen aç: ${olusturulanUrl}`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(metin)}`, '_blank');
        }
    </script>
</body>
</html>
